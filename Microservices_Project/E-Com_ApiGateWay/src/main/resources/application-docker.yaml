spring:
  application:
    name: EComApiGateWay

  config:
    import: optional:configserver:http://config-server:8888

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8987/realms/E-Comm-Application
          jwk-set-uri: http://keycloak:8080/realms/E-Comm-Application/protocol/openid-connect/certs


eureka:
  client:
    service-url:
      defaultZone: http://eureka:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    #    hostname: localhost
    prefer-ip-address: true

#management:
#  endpoints:
#    web:
#      exposure:
#        include: "*"
#  tracing:
#    sampling:
#      probability: 0.0
management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1.0

  endpoint:
    circuitbreakers:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      ECommCircuitBreaker:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 50
        automatic-transition-from-open-to-half-open-enabled: true
        sliding-window-type: COUNT_BASED