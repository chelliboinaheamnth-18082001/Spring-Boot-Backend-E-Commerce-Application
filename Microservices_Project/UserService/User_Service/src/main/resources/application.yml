spring:
  application:
    name: UserService

  config:
    import: optional:configserver:http://localhost:8888

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1.0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: localhost
    prefer-ip-address: true

logging:
  file:
    name: microservices_logs/UserService.log
  level:
    root: INFO
    org.springframework.web.client: DEBUG


keycloak:
  admin:
    username: user1
    password: User1@123
    server-url: http://localhost:8987   # ✅ FIXED (was http://keycloak:8987)
    realm: E-Comm-Application
    client-id: admin-cli
    client-uid: fca6137e-88dd-47c3-844c-8deb95edb713
