server:
  port: 8888

spring:
  application:
    name: SpringCloud_ConfigServer

  cloud:
    config:
      server:
        git:
          uri: https://github.com/chelliboinaheamnth-18082001/SpringBoot-Microservices_E-Commerce_Configurations
          default-label: main   # ? Important: use 'main' instead of 'master'

  rabbitmq:
    host: rabbitmq_container
    port: 5672
    username: guest
    password: guest


management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1.0

eureka:
  client:
    service-url:
      defaultZone: http://eureka:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
#    hostname: localhost
    prefer-ip-address: true

logging:
  file:
    name: microservices_logs/SpringCloud_ConfigServer.log
  level:
    root: INFO
    org.springframework.web.client: DEBUG